# Production-подобная конфигурация (ТЗ п.13, 39, 40, 57).
# Не готовый деплой, а образец топологии: реальные секреты, TLS и
# managed-сервисы задаются на целевой площадке.
#
#   cp .env.example .env && отредактировать
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  postgres:
    image: postgres:16-alpine
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Наружу не публикуется вовсе: база доступна только внутри сети

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      # transaction pooling (ТЗ п.13): соединение возвращается в пул после
      # каждой транзакции, поэтому десятки воркеров делят единицы соединений.
      # ВАЖНО: в этом режиме Django обязан работать с CONN_MAX_AGE=0 —
      # persistent-соединения на стороне приложения его смысл уничтожают.
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "25"
      AUTH_TYPE: scram-sha-256
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command: >-
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory ${REDIS_MAXMEMORY:-256mb}
      --maxmemory-policy allkeys-lru
      --save ""
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  app: &app
    build:
      context: .
      dockerfile: Dockerfile
    environment: &app_env
      DJANGO_ENV: production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS}
      DB_ENGINE: postgresql
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      # Через PgBouncer, а не напрямую в PostgreSQL
      DB_HOST: pgbouncer
      DB_PORT: "5432"
      # 0 обязателен при transaction pooling
      DB_CONN_MAX_AGE: "0"
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "False"
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
    volumes:
      - static:/app/staticfiles
      - media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    # Время на завершение текущих транзакций голосования (ТЗ п.44).
    # Должно превышать GUNICORN_GRACEFUL_TIMEOUT.
    stop_grace_period: 45s

  # Очередь веб-нагрузки: короткие задачи, не конкурируют с импортом
  celery-default:
    <<: *app
    command: ["celery", "-A", "config", "worker", "-Q", "default,notifications", "-c", "4", "-l", "info"]
    healthcheck:
      disable: true

  # Тяжёлые задачи отдельно (ТЗ п.42): импорт списка студентов и выгрузка
  # Excel не должны занимать воркеров, обслуживающих голосование
  celery-heavy:
    <<: *app
    command: ["celery", "-A", "config", "worker", "-Q", "imports,maintenance", "-c", "2", "-l", "info"]
    healthcheck:
      disable: true

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/vote_proxy_params.conf:/etc/nginx/vote_proxy_params.conf:ro
      - static:/srv/static:ro
      - media:/srv/media:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:
  static:
  media:
