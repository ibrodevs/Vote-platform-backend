# Пример production-конфигурации Nginx (ТЗ п.59, 60).
#
# ГЛАВНОЕ: в логи не должны попадать Authorization и тело POST /vote.
# Стандартный combined-формат пишет $http_referer и $http_user_agent,
# но не заголовки — а вот отдельные "удобные" настройки логирования тела
# запроса превратили бы access.log в реестр того, кто за кого голосовал.

upstream vote_backend {
    server app:8000 max_fails=3 fail_timeout=10s;
    # Пул постоянных соединений к приложению: без него каждый запрос
    # открывает новый TCP-сокет к upstream.
    keepalive 64;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

# Реальный IP берётся ТОЛЬКО от доверенного прокси. Без set_real_ip_from
# любой клиент подделал бы X-Forwarded-For и обошёл rate limiting (ТЗ п.60).
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Лимиты запросов на уровне edge — дополнение к прикладному rate limiting,
# а не замена: здесь ключ по IP, а за университетским NAT тысячи студентов.
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=60r/s;

log_format vote_safe '$remote_addr $request_method $uri $status '
                     '$body_bytes_sent $request_time';

server {
    listen 443 ssl;
    http2 on;
    server_name api.example.kg;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    access_log /var/log/nginx/access.log vote_safe;

    # Тело запроса ограничено: загрузка списка студентов — самое большое,
    # что сюда приходит.
    client_max_body_size 20m;
    client_body_timeout 30s;
    client_header_timeout 15s;

    gzip on;
    gzip_types application/json text/plain text/css application/javascript;
    gzip_min_length 1024;

    # Статика и медиа мимо Django (ТЗ п.31): каждый запрос за фотографией
    # кандидата, дошедший до приложения, занимает воркер вместо голоса.
    location /static/ {
        alias /srv/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /media/ {
        alias /srv/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location = /health/live {
        proxy_pass http://vote_backend;
        access_log off;
    }

    # Строгий лимит на аутентификацию (ТЗ п.36)
    location ~ ^/api/v1/(auth|students/auth)/ {
        limit_req zone=auth_zone burst=5 nodelay;
        include /etc/nginx/vote_proxy_params.conf;
        proxy_pass http://vote_backend;
    }

    location /api/ {
        limit_req zone=api_zone burst=120 nodelay;
        include /etc/nginx/vote_proxy_params.conf;
        proxy_pass http://vote_backend;
    }

    location / {
        return 404;
    }
}

server {
    listen 80;
    server_name api.example.kg;
    return 301 https://$host$request_uri;
}
