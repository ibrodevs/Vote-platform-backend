# ==============================================================================
# IP Allowlist для доступа к Django Admin (ТЗ п.10)
# ==============================================================================
# В bootstrap-режиме (начальный запуск по IP) доступ открыт для настройки.
# В production-режиме доступ ограничивается доверенным IP-адресом администратора
# или внутренней VPN-подсетью.
#
# Если в .env задан ADMIN_ALLOWED_IP, скрипты deploy.sh / preflight.sh
# автоматически прописывают директивы:
#   allow <ADMIN_ALLOWED_IP>;
#   deny all;
#
# Для ручной настройки нескольких IP-адресов раскомментируйте строки ниже:
# allow 198.51.100.42;
# allow 10.8.0.0/24;
# deny all;
# ==============================================================================
