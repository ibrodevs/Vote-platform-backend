# Main Nginx config for the Hetzner CCX33 election-day profile.
# Per-vhost routing/cache/rate-limit policy lives in conf.d/*.conf.
user nginx;
worker_processes auto;
worker_rlimit_nofile 131072;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    use epoll;
    worker_connections 32768;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Browser/LB connections are intentionally long-lived during the 12:00 burst.
    keepalive_timeout 65s;
    keepalive_requests 100000;

    client_header_timeout 15s;
    client_body_timeout 30s;
    send_timeout 30s;
    reset_timedout_connection on;

    # Hash tables large enough for the API headers without per-start warnings.
    types_hash_max_size 4096;
    server_names_hash_bucket_size 64;

    server_tokens off;

    # Docker json-file already handles rotation; buffering avoids a write syscall
    # for every request when access logging is enabled.
    access_log /var/log/nginx/access.log combined buffer=256k flush=1s;

    include /etc/nginx/conf.d/*.conf;
}
