# ==============================================================================
# Общие параметры проксирования Nginx к Gunicorn upstream (ТЗ п.15, 45, 95)
# Подключается через: include /etc/nginx/vote_proxy_params.conf;
# ==============================================================================

proxy_http_version 1.1;

# Пустой Connection обязателен для работы keepalive-пула соединений к upstream
proxy_set_header Connection "";

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $server_port;

# Таймауты (ТЗ п.45, 95). Не держать зависшие соединения,
# освобождать воркеры вовремя
proxy_connect_timeout 5s;
proxy_send_timeout    30s;
proxy_read_timeout    30s;

# Буферизация ответов: Nginx забирает ответ у Gunicorn быстро
# и отдаёт медленному клиенту, освобождая Python worker
proxy_buffering on;
proxy_buffers 16 16k;
proxy_buffer_size 32k;

# Повтор запросов при сбое upstream (ТЗ п.15):
# В Nginx non-idempotent запросы (POST) по умолчанию НЕ повторяются,
# чтобы не задвоить голос. Для критического endpoint /api/v1/voting/cast/
# повторы дополнительно отключены директивой proxy_next_upstream off.
proxy_next_upstream error timeout http_502 http_503;
proxy_next_upstream_tries 2;
proxy_request_buffering on;
