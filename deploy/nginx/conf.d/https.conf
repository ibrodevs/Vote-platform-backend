# ==============================================================================
# Nginx Mode B — Production Domain with TLS (HTTPS)
# (ТЗ п.3, 14, 15, 16, 17, 28)
# ==============================================================================
# Включается после привязки домена и получения сертификатов Let's Encrypt / TLS:
#   1. Положить сертификаты в deploy/certs/fullchain.pem и privkey.pem
#      (или выпустить через certbot в volume certbot_www)
#   2. В .env установить: NGINX_CONF_FILE=https.conf
#   3. Перезапустить nginx: docker compose -f docker-compose.prod.yml up -d nginx
# ==============================================================================

upstream vote_backend {
    server app:8000 max_fails=3 fail_timeout=10s;
    # Пул постоянных соединений к Gunicorn (ТЗ п.15)
    keepalive 64;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

# Доверенные диапазоны для корректного определения клиентского IP (ТЗ п.60)
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# ------------------------------------------------------------------------------
# RATE LIMITING С МЕХАНИЗМОМ LOAD TEST BYPASS (ТЗ п.16)
# ------------------------------------------------------------------------------
geo $is_load_test_client {
    default 0;
    127.0.0.1 1;
    # Добавьте сюда IP-адрес сервера-генератора k6 при тестировании:
    # 198.51.100.50 1;
}

map $is_load_test_client $rate_limit_key_auth {
    0 $binary_remote_addr;
    1 "";
}

map $is_load_test_client $rate_limit_key_api {
    0 $binary_remote_addr;
    1 "";
}

limit_req_zone $rate_limit_key_auth zone=auth_zone:10m rate=10r/m;
limit_req_zone $rate_limit_key_api zone=api_zone:10m rate=60r/s;

# Безопасный формат логов: не логирует Authorization и тело POST /vote (ТЗ п.4, 61)
log_format vote_safe '$remote_addr $request_method $uri $status '
                     '$body_bytes_sent $request_time';

# ------------------------------------------------------------------------------
# ПЕРЕНАПРАВЛЕНИЕ HTTP -> HTTPS
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ACME-challenge для автоматического обновления certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# ОСНОВНОЙ HTTPS СЕРВЕР
# ------------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS (ТЗ п.32, 97)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    access_log /var/log/nginx/access.log vote_safe;
    error_log  /var/log/nginx/error.log warn;

    client_max_body_size 20m;
    client_body_timeout 30s;
    client_header_timeout 15s;

    gzip on;
    gzip_types application/json text/plain text/css application/javascript;
    gzip_min_length 1024;

    # Раздача статики и медиа в обход Gunicorn (ТЗ п.25, 31)
    location /static/ {
        alias /srv/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /media/ {
        alias /srv/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Health-чеки приложения (ТЗ п.17)
    location = /health/live {
        proxy_pass http://vote_backend;
        access_log off;
    }

    location = /health/ready {
        proxy_pass http://vote_backend;
        access_log off;
    }

    location = /api/health/ {
        proxy_pass http://vote_backend;
        access_log off;
    }

    # Метрики Prometheus: защищены токеном на уровне Django (ТЗ п.28)
    location = /metrics {
        include /etc/nginx/vote_proxy_params.conf;
        proxy_pass http://vote_backend;
    }

    # ВАЖНО (ТЗ п.15): Приём голосов НЕ ДОЛЖЕН автоматически повторяться
    # при ошибке связи с upstream (proxy_next_upstream off), чтобы исключить
    # риск повторной отправки non-idempotent транзакции.
    location ~ ^/api/v1/voting/cast/?$ {
        limit_req zone=api_zone burst=120 nodelay;
        include /etc/nginx/vote_proxy_params.conf;
        proxy_next_upstream off;
        proxy_pass http://vote_backend;
    }

    # Строгий лимит на аутентификацию (ТЗ п.36)
    location ~ ^/api/v1/(auth|students/auth)/ {
        limit_req zone=auth_zone burst=5 nodelay;
        include /etc/nginx/vote_proxy_params.conf;
        proxy_pass http://vote_backend;
    }

    # Общие эндпоинты API
    location /api/ {
        limit_req zone=api_zone burst=120 nodelay;
        include /etc/nginx/vote_proxy_params.conf;
        proxy_pass http://vote_backend;
    }

    # Django admin
    location ~ ^/(admin-django|admin)/ {
        include /etc/nginx/vote_proxy_params.conf;
        proxy_pass http://vote_backend;
    }

    # Корневой маршрут и остальные запросы
    location / {
        include /etc/nginx/vote_proxy_params.conf;
        proxy_pass http://vote_backend;
    }
}
