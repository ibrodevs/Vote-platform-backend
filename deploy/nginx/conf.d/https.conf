# ==============================================================================
# Nginx Mode B — Production HTTPS, election-day profile
# ==============================================================================
# Файл сгенерирован из deploy/nginx/templates/https.conf.template.
# Для production deploy.sh подставляет API_DOMAIN из .env.
# ==============================================================================

proxy_cache_path /var/cache/nginx/vote levels=1:2 keys_zone=vote_cache:64m
                 max_size=512m inactive=10m use_temp_path=off;

map $args $public_cache_bypass {
    ""      0;
    default 1;
}

upstream vote_backend {
    zone vote_backend 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;
    server app:8000 resolve max_fails=3 fail_timeout=10s;
    keepalive 256;
    keepalive_requests 10000;
    keepalive_timeout 60s;
}

set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

geo $is_load_test_client {
    default 0;
    127.0.0.1 1;
}

map $is_load_test_client $rate_limit_key_auth {
    0 $binary_remote_addr;
    1 "";
}
map $is_load_test_client $rate_limit_key_api {
    0 $binary_remote_addr;
    1 "";
}

limit_req_zone $rate_limit_key_auth zone=auth_edge_zone:10m rate=10000r/s;
limit_req_zone $rate_limit_key_api  zone=api_edge_zone:10m  rate=20000r/s;

log_format vote_safe '$remote_addr $request_method $uri $status '
                     '$body_bytes_sent $request_time';

server {
    listen 80;
    listen [::]:80;
    server_name api.example.kg;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://api.example.kg$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.example.kg;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    access_log /var/log/nginx/access.log vote_safe buffer=256k flush=1s;
    error_log  /var/log/nginx/error.log warn;

    client_max_body_size 20m;
    client_body_timeout 30s;
    client_header_timeout 15s;

    gzip on;
    gzip_types application/json text/plain text/css application/javascript;
    gzip_min_length 1024;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /static/ {
        alias /srv/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /media/ {
        alias /srv/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location = /health/live {
        include /etc/nginx/vote_proxy_params.conf;
        proxy_pass http://vote_backend;
        access_log off;
    }

    location = /health/ready {
        include /etc/nginx/vote_proxy_params.conf;
        proxy_pass http://vote_backend;
        access_log off;
    }

    location = /api/health/ {
        include /etc/nginx/vote_proxy_params.conf;
        proxy_pass http://vote_backend;
        access_log off;
    }

    location = /metrics {
        include /etc/nginx/vote_proxy_params.conf;
        proxy_pass http://vote_backend;
    }

    location = /api/v1/universities/ {
        include /etc/nginx/vote_proxy_params.conf;
        proxy_set_header Authorization "";
        proxy_cache vote_cache;
        proxy_cache_bypass $public_cache_bypass;
        proxy_no_cache $public_cache_bypass;
        proxy_cache_valid 200 5s;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 3s;
        proxy_cache_background_update on;
        proxy_cache_revalidate on;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status always;
        proxy_pass http://vote_backend;
    }

    location = /api/v1/elections/recent/ {
        include /etc/nginx/vote_proxy_params.conf;
        proxy_set_header Authorization "";
        proxy_cache vote_cache;
        proxy_cache_bypass $public_cache_bypass;
        proxy_no_cache $public_cache_bypass;
        proxy_cache_valid 200 2s;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 3s;
        proxy_cache_background_update on;
        proxy_cache_revalidate on;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status always;
        proxy_pass http://vote_backend;
    }

    location = /api/v1/elections/public/ {
        include /etc/nginx/vote_proxy_params.conf;
        proxy_set_header Authorization "";
        proxy_cache vote_cache;
        proxy_cache_bypass $public_cache_bypass;
        proxy_no_cache $public_cache_bypass;
        proxy_cache_valid 200 2s;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 3s;
        proxy_cache_background_update on;
        proxy_cache_revalidate on;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status always;
        proxy_pass http://vote_backend;
    }

    location = /api/v1/faqs/ {
        include /etc/nginx/vote_proxy_params.conf;
        proxy_set_header Authorization "";
        proxy_cache vote_cache;
        proxy_cache_bypass $public_cache_bypass;
        proxy_no_cache $public_cache_bypass;
        proxy_cache_valid 200 60s;
        proxy_cache_lock on;
        proxy_cache_background_update on;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status always;
        proxy_pass http://vote_backend;
    }

    location = /api/v1/news/ {
        include /etc/nginx/vote_proxy_params.conf;
        proxy_set_header Authorization "";
        proxy_cache vote_cache;
        proxy_cache_bypass $public_cache_bypass;
        proxy_no_cache $public_cache_bypass;
        proxy_cache_valid 200 30s;
        proxy_cache_lock on;
        proxy_cache_background_update on;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status always;
        proxy_pass http://vote_backend;
    }

    location = /api/v1/news/recent/ {
        include /etc/nginx/vote_proxy_params.conf;
        proxy_set_header Authorization "";
        proxy_cache vote_cache;
        proxy_cache_bypass $public_cache_bypass;
        proxy_no_cache $public_cache_bypass;
        proxy_cache_valid 200 30s;
        proxy_cache_lock on;
        proxy_cache_background_update on;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status always;
        proxy_pass http://vote_backend;
    }

    location ~ ^/api/v1/elections/[0-9a-fA-F-]{36}/candidates/?$ {
        include /etc/nginx/vote_proxy_params.conf;
        proxy_set_header Authorization "";
        proxy_cache vote_cache;
        proxy_cache_bypass $public_cache_bypass;
        proxy_no_cache $public_cache_bypass;
        proxy_cache_valid 200 5s;
        proxy_cache_lock on;
        proxy_cache_background_update on;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status always;
        proxy_pass http://vote_backend;
    }

    location ~ ^/api/v1/candidates/[0-9a-fA-F-]{36}/?$ {
        include /etc/nginx/vote_proxy_params.conf;
        proxy_set_header Authorization "";
        proxy_cache vote_cache;
        proxy_cache_bypass $public_cache_bypass;
        proxy_no_cache $public_cache_bypass;
        proxy_cache_valid 200 5s;
        proxy_cache_lock on;
        proxy_cache_background_update on;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status always;
        proxy_pass http://vote_backend;
    }

    location ~ ^/api/v1/voting/cast/?$ {
        limit_req zone=api_edge_zone burst=40000 nodelay;
        include /etc/nginx/vote_proxy_params.conf;
        proxy_next_upstream off;
        proxy_pass http://vote_backend;
    }

    location ~ ^/api/v1/(auth|students/auth)/ {
        limit_req zone=auth_edge_zone burst=20000 nodelay;
        include /etc/nginx/vote_proxy_params.conf;
        proxy_pass http://vote_backend;
    }

    location /api/ {
        limit_req zone=api_edge_zone burst=40000 nodelay;
        include /etc/nginx/vote_proxy_params.conf;
        proxy_pass http://vote_backend;
    }

    location ~ ^/(admin-django|admin)/ {
        include /etc/nginx/admin_ips.conf;
        include /etc/nginx/vote_proxy_params.conf;
        proxy_pass http://vote_backend;
    }

    location / {
        include /etc/nginx/vote_proxy_params.conf;
        proxy_pass http://vote_backend;
    }
}
