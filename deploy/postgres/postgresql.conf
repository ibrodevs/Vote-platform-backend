# ==============================================================================
# PostgreSQL 16 Production Configuration for Hetzner CCX33
# (8 dedicated vCPU, 32 GB RAM, 240 GB NVMe, Ubuntu 24.04 LTS)
# ==============================================================================
# Election-day принцип: ускоряем запись без ослабления durability.
# fsync/full_page_writes/synchronous_commit остаются ON: HTTP 200 на голос
# означает, что транзакция действительно зафиксирована PostgreSQL.
# ==============================================================================

# ------------------------------------------------------------------------------
# СЕТЬ И ПОДКЛЮЧЕНИЯ
# ------------------------------------------------------------------------------
listen_addresses = '*'
port = 5432
max_connections = 200
superuser_reserved_connections = 3

# ------------------------------------------------------------------------------
# ПАМЯТЬ
# ------------------------------------------------------------------------------
shared_buffers = 4GB
effective_cache_size = 16GB
work_mem = 16MB
maintenance_work_mem = 512MB
autovacuum_work_mem = -1
dynamic_shared_memory_type = posix

# ------------------------------------------------------------------------------
# NVMe / PLANNER
# ------------------------------------------------------------------------------
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100

# ------------------------------------------------------------------------------
# DURABILITY + WAL / CHECKPOINTS
# ------------------------------------------------------------------------------
fsync = on
synchronous_commit = on
full_page_writes = on
wal_level = replica

# Больший WAL buffer и более длинный/плавный checkpoint уменьшают I/O spikes
# при коротком пике голосов, не подтверждая клиенту незаписанную транзакцию.
wal_buffers = 64MB
checkpoint_completion_target = 0.95
checkpoint_timeout = 15min
min_wal_size = 4GB
max_wal_size = 16GB

# Быстрое сжатие TOAST-данных
default_toast_compression = lz4

# ------------------------------------------------------------------------------
# AUTOVACUUM
# ------------------------------------------------------------------------------
autovacuum = on
autovacuum_max_workers = 4
autovacuum_naptime = 15s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_cost_limit = 1000
autovacuum_vacuum_cost_delay = 2ms

# ------------------------------------------------------------------------------
# ЛОГИРОВАНИЕ И МОНИТОРИНГ
# ------------------------------------------------------------------------------
log_destination = 'stderr'
logging_collector = off

# Во время election-day burst не превращаем stdout в bottleneck. Медленные
# запросы всё ещё видны, но нормальный hot path не создаёт тысячи строк/сек.
log_min_duration_statement = 500
log_checkpoints = on
log_connections = off
log_disconnections = off
log_lock_waits = on
log_temp_files = 10MB
log_autovacuum_min_duration = 1000

log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'Asia/Bishkek'
timezone = 'Asia/Bishkek'

# ------------------------------------------------------------------------------
# ЛОКАЛИ
# ------------------------------------------------------------------------------
lc_messages = 'C'
lc_monetary = 'C'
lc_numeric = 'C'
lc_time = 'C'
