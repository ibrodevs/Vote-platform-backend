# ==============================================================================
# PostgreSQL 16 Production Configuration for Hetzner CCX33
# (8 dedicated vCPU, 32 GB RAM, 240 GB NVMe, Ubuntu 24.04 LTS)
# ==============================================================================
# Память сервера делится между:
#   - PostgreSQL (shared_buffers 4GB + work_mem + OS page cache ~16GB)
#   - Gunicorn (4-8 воркеров × 4 потока ~4-6GB)
#   - Celery default/heavy (~2-4GB)
#   - Redis (кэш/брокер 256MB-1GB)
#   - PgBouncer, Nginx, Docker, OS (~2GB)
# ==============================================================================

# ------------------------------------------------------------------------------
# СЕТЬ И ПОДКЛЮЧЕНИЯ
# ------------------------------------------------------------------------------
listen_addresses = '*'
port = 5432

# Пул соединений контролирует PgBouncer перед базой (MAX_CLIENT_CONN=1000,
# DEFAULT_POOL_SIZE=25). База никогда не должна видеть тысячи прямых клиентов.
max_connections = 200
superuser_reserved_connections = 3

# ------------------------------------------------------------------------------
# ПАМЯТЬ
# ------------------------------------------------------------------------------
# 4GB (12.5% от 32GB RAM). Стандартная рекомендация 25% уменьшена, чтобы
# гарантировать достаточно памяти для Gunicorn, Celery и дискового кэша ОС.
shared_buffers = 4GB

# Оценка памяти, доступной под дисковый кэш (shared_buffers + кэш ОС).
# Используется планировщиком для оценки вероятности попадания страницы в RAM.
effective_cache_size = 16GB

# Память на одну операцию сортировки/хэширования внутри запроса.
# При max_connections=200 худший случай: 200 × 16MB = 3.2GB — безопасно от OOM.
work_mem = 16MB

# Память для VACUUM, CREATE INDEX, ALTER TABLE.
maintenance_work_mem = 512MB
autovacuum_work_mem = -1          # Наследует maintenance_work_mem / autovacuum_max_workers
dynamic_shared_memory_type = posix

# ------------------------------------------------------------------------------
# ХРАНИЛИЩЕ И ДИСКОВЫЙ ПЛАНИРОВЩИК (NVMe SSD)
# ------------------------------------------------------------------------------
# Для быстрых NVMe стоимость случайного чтения практически равна последовательному (1.1).
# Дефолт 4.0 рассчитан на HDD и заставляет планировщик необоснованно избегать Index Scan.
random_page_cost = 1.1

# Количество одновременных дисковых операций ввода-вывода, поддерживаемых контроллером NVMe.
effective_io_concurrency = 200

# Детализация гистограмм планировщика запросов
default_statistics_target = 100

# ------------------------------------------------------------------------------
# WAL И CHECKPOINTS
# ------------------------------------------------------------------------------
wal_level = replica
wal_buffers = 16MB

# Сглаживание контрольных точек: растягивает сброс грязных страниц на 90% интервала,
# предотвращая I/O-шипы на NVMe.
checkpoint_completion_target = 0.9
checkpoint_timeout = 10min

min_wal_size = 1GB
max_wal_size = 8GB

# Быстрое сжатие TOAST-данных
default_toast_compression = lz4

# ------------------------------------------------------------------------------
# AUTOVACUUM
# ------------------------------------------------------------------------------
# Критично для выборов: таблица голосов и сессий интенсивно обновляется,
# autovacuum должен вовремя удалять мёртвые кортежи (bloat).
autovacuum = on
autovacuum_max_workers = 4        # Половина от 8 vCPU
autovacuum_naptime = 15s          # Чаще проверять таблицы на необходимость очистки
autovacuum_vacuum_scale_factor = 0.05   # Очистка при изменении 5% строк
autovacuum_analyze_scale_factor = 0.02  # Анализ при изменении 2% строк
autovacuum_vacuum_cost_limit = 1000     # Увеличен лимит для быстрого NVMe (дефолт 200 тормозит на SSD)
autovacuum_vacuum_cost_delay = 2ms

# ------------------------------------------------------------------------------
# ЛОГИРОВАНИЕ И МОНИТОРИНГ
# ------------------------------------------------------------------------------
log_destination = 'stderr'
logging_collector = off           # В Docker логи идут напрямую в stdout/stderr контейнера

# Логировать запросы медленнее 200 мс для выявления узких мест под нагрузкой
log_min_duration_statement = 200

log_checkpoints = on
log_connections = off
log_disconnections = off
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 500

log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'Asia/Bishkek'
timezone = 'Asia/Bishkek'

# ------------------------------------------------------------------------------
# ЛОКАЛИ
# ------------------------------------------------------------------------------
lc_messages = 'C'
lc_monetary = 'C'
lc_numeric = 'C'
lc_time = 'C'
