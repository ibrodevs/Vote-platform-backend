# Общие параметры проксирования. Подключается через include.

proxy_http_version 1.1;
# Пустой Connection нужен, чтобы работал keepalive к upstream
proxy_set_header Connection "";

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

# Таймауты (ТЗ п.45, 95). Держать соединение минутами хуже, чем честно
# вернуть ошибку: зависшие запросы копятся и съедают всех воркеров.
proxy_connect_timeout 5s;
proxy_send_timeout    30s;
proxy_read_timeout    30s;

# Буферизация ответа освобождает воркер приложения раньше: отдавать
# байты медленному клиенту будет Nginx, а не Gunicorn.
proxy_buffering on;
proxy_buffers 16 16k;
proxy_buffer_size 32k;

# Повтор запроса при ошибке — ТОЛЬКО для идемпотентных методов.
# Повторить POST /vote означало бы риск задвоить голос.
proxy_next_upstream error timeout http_502 http_503;
proxy_next_upstream_tries 2;
proxy_request_buffering on;
