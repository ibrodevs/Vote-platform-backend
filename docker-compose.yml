# Локальное окружение разработки, максимально близкое к production (ТЗ п.58).
# Concurrency-тесты нельзя проверять на SQLite — нужен настоящий PostgreSQL.
#
#   docker compose up --build
#   docker compose exec web python manage.py migrate
#   docker compose exec web python manage.py test
#
# Production-конфигурация (gunicorn, nginx, PgBouncer) — этап 7.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-vote_db}
      POSTGRES_USER: ${DB_USER:-vote_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vote_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT_HOST:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-vote_user} -d ${DB_NAME:-vote_db}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT_HOST:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment: &django_env
      DJANGO_ENV: development
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-insecure-key}
      DB_ENGINE: postgresql
      DB_NAME: ${DB_NAME:-vote_db}
      DB_USER: ${DB_USER:-vote_user}
      DB_PASSWORD: ${DB_PASSWORD:-vote_password}
      DB_HOST: postgres
      DB_PORT: "5432"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      # Реальный worker, а не синхронное выполнение в web-процессе (ТЗ п.40)
      CELERY_TASK_ALWAYS_EAGER: "False"
    volumes:
      - .:/app
      - media:/app/media
    ports:
      - "${WEB_PORT_HOST:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: ["celery", "-A", "config", "worker", "-l", "info"]
    environment: *django_env
    volumes:
      - .:/app
      - media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  media:
